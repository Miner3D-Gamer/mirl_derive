[package]
name = "mirl_derive"
version = "0.0.0-alpha"
repository = "https://github.com/Miner3D-Gamer/mirl_derive"
edition = "2024"
license.workspace = true
authors.workspace = true
description = "A crate that tries to make derives less work by assuming all derives are desired on a struct/enum by default instead of None"
readme = "README.md"
categories = ["development-tools"]
rust-version.workspace = true


[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

[lints]
workspace = true
